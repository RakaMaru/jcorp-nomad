<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Nomad • Menu</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script defer src="/assets/library.js?v=4"></script>
  <style>
    .menu-grid{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); }
    .menu-card .title{ display:flex; align-items:center; justify-content:space-between; }
    .menu-card .badge{ font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Nomad</h1>
  </header>

  <div class="container">
    <div id="grid" class="menu-grid">
      <!-- Cards will be injected with live counts -->
    </div>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", async () => {
    try {
      // Use shared loader helpers from /assets/library.js
      const db    = await fetchDB();
      const items = normalizeItems(db);

      const count = {
        movies : filterByCategory(items, "movie").length,
        shows  : filterByCategory(items, "show").length,
        music  : filterByCategory(items, "music").length,
        images : filterByCategory(items, "image").length,
        books  : filterByCategory(items, "book").length,
        files  : filterByCategory(items, "file").length,
      };

      const cards = [
        { href: "/movies.html",  label: "Movies",  badge: count.movies  },
        { href: "/shows.html",   label: "Shows",   badge: count.shows   },
        { href: "/music.html",   label: "Music",   badge: count.music   },
        { href: "/gallery.html", label: "Gallery", badge: count.images  },
        { href: "/books.html",   label: "Books",   badge: count.books   },
        { href: "/files.html",   label: "Files",   badge: count.files   },
        { href: "/admin.html",   label: "Admin",   badge: ""            },
      ];

      const el = document.getElementById("grid");
      el.innerHTML = cards.map(c => `
        <a class="card menu-card" href="${c.href}">
          <div class="title">
            <span>${c.label}</span>
            <span class="badge">${c.badge !== "" ? c.badge + " item" + (c.badge===1?"":"s") : ""}</span>
          </div>
        </a>
      `).join("");
    } catch (e) {
      const el = document.getElementById("grid");
      el.innerHTML = `<div class="error">Failed to load menu: ${e.message||e}</div>`;
      console.error(e);
    }
  });
  </script>
</body>
</html>
